# Local PostgreSQL for the Diski 9 competition backend (Phase 6C.1).
# Development only: credentials come from .env (see .env.example) and the port is
# bound to localhost. The SQLite football store is not affected.
# Commands (start, status, stop, reset): see docs/backend.md.
name: diski9

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DISKI9_PG_DATABASE:-diski9}
      POSTGRES_USER: ${DISKI9_PG_USER:-diski9}
      POSTGRES_PASSWORD: ${DISKI9_PG_PASSWORD:?set DISKI9_PG_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    ports:
      - "127.0.0.1:${DISKI9_PG_PORT:-5432}:5432"
    volumes:
      - diski9_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # name the role and database: without -U, pg_isready connects as the container's
      # OS user ("root"), which logs a FATAL "role does not exist" line every 5 seconds
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  diski9_pgdata:
