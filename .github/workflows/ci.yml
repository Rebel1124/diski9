# Automated repository checks (T-13): lint, formatting and the full test suite,
# including the competition-backend tests against a real PostgreSQL service.
# Documentation-only changes (Phase 6C.6, owner-approved): tools/ci/change_scope.py
# decides from the full change set of the push or pull request; only when every
# changed file is documentation that no code or test reads does the job skip the
# migration, Supabase Auth and test-suite steps (lint, formatting and a relative-link
# check still run). Anything ambiguous runs everything. The job name `checks` (the
# status check) is unchanged and always reports.
# No football-API credentials are provided or needed: tests use recorded fixtures
# and mock transports, so CI never spends the API allowance.
# Browser tests run with Node and the Playwright version pinned in package-lock.json.
name: CI

on:
  push:
    branches: [main, "feature/**", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    # 60 (was 40; owner-approved, Phase 8 R2, 28 Nov 2026). History: 30 -> 40 when the
    # browser tests added ~5 min and tooling ~1 min (Phase 6C.6 Stage B). By R2 the suite
    # had grown to ~2600 tests: run #179 spent 33.6 min in the test step and run #180
    # was cancelled at 40 min with pytest at 97%, so 40 left no margin for runner
    # variance. No test is skipped, removed or shortened to save time.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: diski9
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: diski9_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diski9 -d diski9_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DISKI9_APP_ENVIRONMENT: test
      DISKI9_APP_TEST_DATABASE_URL: postgresql+psycopg://diski9:ci-only-password@localhost:5432/diski9_test
      DISKI9_REQUIRE_POSTGRES: "1"
      # Point any accidental football-API call at a closed port: tests must stay offline.
      DISKI9_API_FOOTBALL_BASE_URL: http://127.0.0.1:9/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the change set can be computed

      - name: Decide scope (documentation-only changes skip the test suite)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/change_scope.py --event "$EVENT" --before "$BEFORE" \
            --after "$AFTER" --base "$PR_BASE" --head "$PR_HEAD" || echo "scope=full" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra server

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Documentation links (documentation-only changes)
        if: steps.scope.outputs.scope == 'docs'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then range="$PR_BASE...$PR_HEAD"; else range="$BEFORE..$AFTER"; fi
          files=$(git diff --name-only --no-renames --diff-filter=d "$range" -- '*.md')
          python3 tools/ci/change_scope.py --check-links $files

      - name: Competition schema migrates cleanly from an empty database
        if: steps.scope.outputs.scope != 'docs'
        env:
          DISKI9_APP_DATABASE_URL: postgresql+psycopg://diski9:ci-only-password@localhost:5432/diski9_test
        run: |
          uv run diski9 app-db upgrade
          uv run diski9 app-db upgrade
          uv run diski9 app-db check
          uv run diski9 app-db downgrade --revision base
          uv run diski9 app-db upgrade

      - name: Start a real Supabase Auth server (official image) for integration tests
        if: steps.scope.outputs.scope != 'docs'
        env:
          SUPABASE_AUTH_IMAGE: supabase/gotrue:v2.198.0
        run: |
          docker pull -q "$SUPABASE_AUTH_IMAGE"
          bin=$(docker run --rm --entrypoint sh "$SUPABASE_AUTH_IMAGE" -c 'command -v auth || command -v gotrue')
          docker create --name supabase-auth "$SUPABASE_AUTH_IMAGE" >/dev/null
          docker cp "supabase-auth:$bin" ./supabase-auth-bin
          docker rm supabase-auth >/dev/null
          uv run python tools/local_auth/local_auth.py prepare \
            --admin-url postgresql://diski9:ci-only-password@localhost:5432/postgres
          # the project interpreter directly (not `uv run`), so the long-running server
          # does not hold uv's cache lock when the job's cache clean-up runs
          nohup .venv/bin/python tools/local_auth/local_auth.py run --gotrue ./supabase-auth-bin \
            --auth-db-url postgres://supabase_auth_admin:local-auth-only@localhost:5432/diski9_auth_local \
            > supabase-auth.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -f tmp/local_auth/env ] && curl -sf http://127.0.0.1:9999/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9999/health || (cat supabase-auth.log; exit 1)
          cat tmp/local_auth/env >> "$GITHUB_ENV"
          echo "DISKI9_TEST_SUPABASE_DB_URL=postgresql+psycopg://diski9:ci-only-password@localhost:5432/diski9_auth_local" >> "$GITHUB_ENV"
          echo "DISKI9_REQUIRE_SUPABASE_AUTH=1" >> "$GITHUB_ENV"

      # Browser tests (Phase 6C.6 Stage B, owner-approved): Node and the Playwright
      # version pinned in package-lock.json, plus only the Chromium headless shell
      # and the system libraries it needs. DISKI9_REQUIRE_BROWSER=1 makes missing or
      # broken tooling fail tests/test_browser_tooling.py instead of skipping.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope != 'docs'
        with:
          node-version: "22"
          cache: npm

      - name: Install browser-test tooling (pinned Playwright, Chromium headless shell)
        if: steps.scope.outputs.scope != 'docs'
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps --only-shell chromium

      - name: Install age (Stage F3 owner-script tests)
        if: steps.scope.outputs.scope != 'docs'
        run: sudo apt-get install -y --no-install-recommends age

      - name: Test suite (PostgreSQL, real Supabase Auth and browser tests)
        if: steps.scope.outputs.scope != 'docs'
        env:
          DISKI9_REQUIRE_BROWSER: "1"
        # -v names each test as it finishes (so a failure is identifiable by name even
        # if the job is cancelled); -rfEs summarises failures, errors and skips;
        # --durations=25 records the slowest tests. Reporting only: the same tests run
        # with the same pass/fail outcome.
        run: uv run pytest -v -p no:cacheprovider -rfEs --durations=25

      - name: Stop the Supabase Auth server
        if: always()
        run: |
          pkill -f tools/local_auth/local_auth.py || true
          pkill -f supabase-auth-bin || true
