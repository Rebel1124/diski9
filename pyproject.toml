[project]
name = "diski9"
version = "4.2.0"
description = "Diski 9 — football statistical screener and virtual weekly challenge"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "dash>=4.5.0",
    "httpx>=0.28.1",
    # Phase 8 CP2B.1 (CP1-5): the market-implied fit (L-BFGS-B, SVD identifiability).
    "numpy>=2.5.5,<3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.9",
    "scipy>=1.18.1,<2",
    "sqlalchemy>=2.1.8",
    "supabase-auth>=2.20",
]

[project.optional-dependencies]
# Production WSGI server (Phase 6C.6 Stage F2, SF-13). Not installed by default:
# `uv sync --extra server` on a host. CI installs it for the WSGI test.
server = ["gunicorn==26.2.0"]

[project.scripts]
diski9 = "diski9.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:dash"
filterwarnings = ["ignore::DeprecationWarning:dash.development.base_component"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/diski9/app/views.py" = ["E501"]  # user-facing prose strings
"src/diski9/research/charts.py" = ["E501"]  # inline SVG markup
