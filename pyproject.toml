[project]
name = "diski9"
version = "0.1.0"
description = "Diski 9 — football statistical screener and virtual weekly challenge"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "dash>=4.5.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
diski9 = "diski9.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:dash"
filterwarnings = ["ignore::DeprecationWarning:dash.development.base_component"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
