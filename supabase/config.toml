# Local Supabase stack for Diski 9 development (Supabase CLI: `supabase start`).
# Development only. See docs/authentication.md, "Local development on a Mac".
# The competition schema `app` is migrated by Alembic (`diski9 app-db upgrade`),
# never by Supabase CLI migrations, and is not exposed through the Data API.
project_id = "diski9"

[api]
enabled = true
port = 54321
# Only Supabase's defaults are exposed; schema "app" stays private.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep in step with the hosted project (check with: SHOW server_version).
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
# Local email testing inbox (Mailpit) at http://127.0.0.1:54324
# (named [inbucket] in Supabase CLI versions before 2.108)
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:8050"
# Exact URLs only (no wildcards): where confirmation and recovery links may land.
additional_redirect_urls = ["http://127.0.0.1:8050/auth/confirm", "http://localhost:8050/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
# Asymmetric signing keys (recommended); create the file with
#   echo "[]" > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256
# (git-ignored). Remove this line to use the legacy shared secret locally.
signing_keys_path = "./signing_keys.json"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Confirm your Diski 9 account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Diski 9 password"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
# Google sign-in is deferred (Phase 6C.2 brief); configure later with client id/secret
# from environment variables, never committed values.
enabled = false
