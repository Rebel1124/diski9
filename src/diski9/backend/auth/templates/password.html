{% extends "base.html" %}
{% block content %}
<form class="auth-card" method="post" action="/auth/password" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="auth-field"><label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="72">
    <div class="hint">At least 10 characters. Other devices will be signed out.</div></div>
  <div class="auth-field"><label for="confirm">Repeat the new password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="72"></div>
  <div class="auth-actions"><button class="ch-btn primary" type="submit">Save password</button></div>
</form>
{% endblock %}
