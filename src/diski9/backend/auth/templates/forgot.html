{% extends "base.html" %}
{% block content %}
<form class="auth-card" method="post" action="/auth/forgot" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="auth-field"><label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="320"></div>
  <div class="auth-actions"><button class="ch-btn primary" type="submit">Send reset link</button></div>
  <div class="auth-links"><a href="/auth/sign-in">Back to sign in</a></div>
</form>
{% endblock %}
